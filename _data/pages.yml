# One entry per page. The ORDER here is the order of the navigation menu.
#
#   key      - short id. Used in a page's front matter (page_key: exp) and as the
#              Tailwind color name, so text-exp / bg-exp / border-exp all work.
#   label    - name shown in the nav
#   url      - the html file
#   color    - the page's accent (also --accent inside that page, --c-<key> everywhere)
#   light /  - lighter and darker shades of the accent
#   dark
#   favicon  - tab icon and the little logo in the top-left of the nav
#   emoji    - shown in the visitor counter badge
#   nav      - set to false to keep a page out of the menu (e.g. the Paris guide)

- key: home
  label: Home
  url: index.html
  color: "#ad1457"
  light: "#cd729a"
  dark: "#dc2626"
  favicon: https://valerianicolette.wordpress.com/wp-content/uploads/2025/07/vmindex.png
  emoji: "🎨"

